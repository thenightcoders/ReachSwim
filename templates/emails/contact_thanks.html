<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks for getting in touch</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a1a; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .header { background: #1a1a1a; padding: 32px 40px; }
    .header h1 { margin: 0; color: #fff; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .header p { margin: 4px 0 0; color: #aaa; font-size: 14px; }
    .body { padding: 36px 40px; }
    .body p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #333; }
    .footer { padding: 24px 40px; background: #f7f9fc; border-top: 1px solid #eee; }
    .footer p { margin: 0; font-size: 13px; color: #888; line-height: 1.5; }
    .footer a { color: #2563eb; text-decoration: none; }

    @media (max-width: 600px) {
      .wrapper { margin: 0 !important; border-radius: 0 !important; }
      .header { padding: 24px 20px !important; }
      .body { padding: 24px 20px !important; }
      .footer { padding: 20px !important; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>Message received</h1>
      <p>ReachSwim — Adult Swim Coaching</p>
    </div>
    <div class="body">
      <p>Hi {{ first_name }},</p>
      <p>Thanks for getting in touch. {{ config.success_message }}</p>
      <p>There's no need to reply to this email. If you need to add something, just use the contact form again.</p>
    </div>
    <div class="footer">
      <p>&copy; ReachSwim · <a href="{{ site_url }}">{{ site_url|cut:"https://"|cut:"http://" }}</a></p>
    </div>
  </div>
</body>
</html>
