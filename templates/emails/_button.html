{# {% include "emails/_button.html" with url=... label=... %} — add secondary=True for the outlined style. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="btn" style="margin:28px 0 8px; border-collapse:separate;">
  <tr>
    {% if secondary %}
    <td style="border:1.5px solid #0c2233; border-radius:999px;" class="rule">
      <a class="t-ink" href="{{ url }}" style="display:inline-block; padding:13px 28px; font-family:Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:15px; line-height:20px; font-weight:700; color:#0c2233; text-decoration:none; border-radius:999px; text-align:center;">{{ label }}</a>
    </td>
    {% else %}
    <td class="btn-bg" bgcolor="#0c2233" style="background-color:#0c2233; border-radius:999px;">
      <a href="{{ url }}" style="display:inline-block; padding:15px 30px; font-family:Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:15px; line-height:20px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:999px; text-align:center;">{{ label }}&nbsp;&nbsp;&rarr;</a>
    </td>
    {% endif %}
  </tr>
</table>
